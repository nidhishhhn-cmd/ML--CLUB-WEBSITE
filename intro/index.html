<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ML CLUB | Srinivas Institute of Technology</title>
  <meta name="description"
    content="Machine Learning Club — Srinivas Institute of Technology. Official Hub for Artificial Intelligence & Neural Research.">

  <!-- Google Fonts: Instrument Serif, Inter & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01040a;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* Main Viewport Container with 2.5s Cinematic Fade-out (2-3 seconds) */
    #intro-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #01040a;
      overflow: hidden;
      cursor: pointer;
      will-change: opacity, filter, transform;
      transition: opacity 2000ms cubic-bezier(0.4, 0, 0.2, 1),
        filter 2000ms cubic-bezier(0.4, 0, 0.2, 1),
        transform 2000ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    #intro-stage.exit {
      opacity: 0;
      filter: blur(18px);
      transform: scale(1.05);
      pointer-events: none;
    }

    /* Fullscreen Background Cinematic Video */
    .intro-video-bg {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.92) contrast(1.06) saturate(1.05);
      transition: filter 2000ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 2000ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #intro-stage.exit .intro-video-bg {
      filter: brightness(1.12) contrast(1.1) blur(24px);
      transform: scale(1.08);
    }

    /* Vignette Scrim for High-Contrast Text Legibility */
    .video-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(1, 4, 10, 0.45) 0%, rgba(1, 4, 10, 0.85) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 2000ms ease;
    }

    #intro-stage.exit .video-scrim {
      opacity: 0;
    }

    /* Soft Ambient Glow Behind Text */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(320px, 65vw, 750px);
      height: clamp(220px, 45vh, 480px);
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.18) 0%, rgba(99, 102, 241, 0.1) 45%, transparent 75%);
      filter: blur(75px);
      pointer-events: none;
      z-index: 3;
      animation: pulseGlow 6s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.6;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 1;
      }
    }

    /* Architectural Hairline Grid Overlay */
    .hairline-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      background-position: center center;
      pointer-events: none;
      z-index: 4;
      mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
    }

    /* Ambient Neural Particles Canvas */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Top Bar Telemetry & Controls */
    .top-bar {
      position: absolute;
      top: 2.2rem;
      left: 2.5rem;
      right: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .telemetry-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      background: rgba(4, 18, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .audio-btn,
    .skip-btn {
      background: rgba(4, 18, 30, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      padding: 0.5rem 1.15rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .audio-btn:hover,
    .skip-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.5);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.3);
    }

    /* Pure Typographic Showcase Center */
    .typography-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 920px;
      padding: 0 2rem;
    }

    /* College Pre-Title */
    .college-header {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .college-header .line {
      width: 28px;
      height: 1px;
      background: rgba(56, 189, 248, 0.5);
    }

    /* Grand Main Title */
    .main-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(3rem, 8vw, 6.2rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 1.3rem;
      position: relative;
      animation: titleReveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .main-title .word-regular {
      color: #ffffff;
      display: inline-block;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .main-title .word-italic {
      font-style: italic;
      background: linear-gradient(135deg, #38bdf8 20%, #818cf8 60%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      padding: 0 4px;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    }

    /* Shimmer reflection sweeping across title */
    .title-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
          transparent 35%,
          rgba(255, 255, 255, 0.4) 50%,
          transparent 65%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      animation: titleShine 4s infinite cubic-bezier(0.16, 1, 0.3, 1) 1s;
    }

    @keyframes titleShine {
      0% {
        background-position: 200% 0;
      }

      40% {
        background-position: -200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Subtitle & Department */
    .dept-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.72rem, 1.5vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0.7rem;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }

    .tagline {
      font-size: clamp(0.9rem, 1.8vw, 1.08rem);
      font-weight: 300;
      color: #cbd5e1;
      letter-spacing: 0.06em;
      margin-bottom: 2.5rem;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .tagline span {
      color: #f8fafc;
      font-weight: 500;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Slim Luxury Progress Line */
    .timeline-indicator {
      width: 100%;
      max-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
    }

    .track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      border-radius: 99px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      transition: width 0.1s linear;
    }

    .status-text {
      font-family: 'Space Grotesk', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
    }

    /* Bottom Prompt Pill */
    .tap-hint {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      z-index: 20;
      pointer-events: none;
      animation: pulseDot 2.5s infinite ease-in-out;
    }

    /* Responsive Design */
    @media (max-width: 640px) {
      .top-bar {
        top: 1.2rem;
        left: 1.2rem;
        right: 1.2rem;
      }

      .college-header {
        font-size: 0.65rem;
        letter-spacing: 0.22em;
      }

      .college-header .line {
        width: 16px;
      }

      .dept-title {
        font-size: 0.68rem;
        letter-spacing: 0.16em;
      }

      .tagline {
        font-size: 0.85rem;
        margin-bottom: 2rem;
      }

      .tap-hint {
        bottom: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <div id="intro-stage">
    <!-- Fullscreen Pure Video Player (Played as Intro from images folder) -->
    <video id="intro-video" class="intro-video-bg" autoplay playsinline webkit-playsinline disablePictureInPicture controlsList="nodownload noplaybackrate nofullscreen"
      preload="auto">
      <source src="../images/video.mp4" type="video/mp4">
      <source src="../images/video.mp4.mp4" type="video/mp4">
      <source src="../images/hero-video.mp4.MP4" type="video/mp4">
      <source src="../images/hero-video.mp4" type="video/mp4">
      <source src="../images/hero-video.mp4.mp4" type="video/mp4">
      <source src="/images/video.mp4" type="video/mp4">
      <source src="/images/hero-video.mp4.MP4" type="video/mp4">
      <source src="images/video.mp4" type="video/mp4">
      <source src="images/hero-video.mp4.MP4" type="video/mp4">
    </video>

    <!-- Contrast Scrim Layer -->
    <div class="video-scrim"></div>

    <!-- Ambient Backdrop Glow -->
    <div class="ambient-glow"></div>

    <!-- Architectural Hairline Grid -->
    <div class="hairline-grid"></div>

    <!-- Organic Neural Constellation Particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Pure Typographic Showcase -->
    <div class="typography-center">
      <div class="college-header">

      <h1 class="main-title">
        <span class="word-regular">Machine</span>

        <span class="title-shimmer" aria-hidden="true">

        </span>
      </h1>

      <p class="dept-title">
        Artificial Intelligence & Neural Innovations
      </p>

        <span>Mining Knowledge.</span> Powering Tomorrow's Intelligence.
      </p>

      <!-- Video Progress & Timeline Indicator -->
      <div class="timeline-indicator">
        <div class="track">
          <div class="bar" id="progress-bar"></div>
        </div>
        <div class="status-text" id="status-text">INITIALIZING NEURAL LINK...</div>
      </div>
    </div>

    <!-- Space bar skip hint -->
    <div class="tap-hint">
      <span>Press Space bar to skip intro</span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </div>

  </div>

  <script>
    /* =========================================================================
       1. AMBIENT NEURAL CONSTELLATION PARTICLES (60FPS Lightweight Canvas)
       ========================================================================= */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const COUNT = 35;
    const MAX_DIST = 130;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.r = Math.random() * 1.5 + 0.8;
        this.alpha = Math.random() * 0.35 + 0.15;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < COUNT; i++) particles.push(new Particle());

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            const a = (1 - dist / MAX_DIST) * 0.1;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${a})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(renderParticles);
    }
    requestAnimationFrame(renderParticles);

    /* =========================================================================
       2. CINEMATIC VIDEO PLAYBACK & 2-3s FADE-OUT ANIMATION (2500ms)
       ========================================================================= */
    const stage = document.getElementById('intro-stage');
    const video = document.getElementById('intro-video');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');
    const soundPrompt = document.getElementById('introSoundPrompt');

    const FADE_OUT_DURATION = 2000; // 2.0s smooth fade out
    let exited = false;

    // =========================================================================
    // AUDIO DSP ENGINE: DUCK BACKGROUND MUSIC & BOOST BREAKING BLOCK SFX
    // =========================================================================
    let audioCtx = null;
    let audioSourceNode = null;

    function initAudioDSP() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return;
      }

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();

        audioSourceNode = audioCtx.createMediaElementSource(video);

        // 1. Low-Shelf Filter: HEAVY BACKGROUND MUSIC BASS CUT (-18dB)
        // Eliminates the rumbling basslines and synthesizer bass chords of the music
        const musicBassCut = audioCtx.createBiquadFilter();
        musicBassCut.type = 'lowshelf';
        musicBassCut.frequency.value = 420;
        musicBassCut.gain.value = -18.0; // Cut background music bass by -18dB (whisper quiet)

        // 2. Wide Peaking Filter: HEAVY BACKGROUND MUSIC HARMONY/PAD CUT (-15dB)
        // Tones down the background chords, pads, and rhythm progression
        const musicMidCut1 = audioCtx.createBiquadFilter();
        musicMidCut1.type = 'peaking';
        musicMidCut1.frequency.value = 750;
        musicMidCut1.Q.value = 0.8;
        musicMidCut1.gain.value = -15.0; // Cut music chord progression by -15dB

        // 3. Peaking Filter: MUSIC LEAD & MELODIC LINE CUT (-12dB)
        // Keeps any musical synths and melodies far in the background
        const musicMidCut2 = audioCtx.createBiquadFilter();
        musicMidCut2.type = 'peaking';
        musicMidCut2.frequency.value = 1400;
        musicMidCut2.Q.value = 1.0;
        musicMidCut2.gain.value = -12.0; // Cut melodic music frequencies by -12dB

        // 4. SFX CRUNCH & IMPACT BOOST: MAXIMUM CLARITY FOR BREAKING BLOCKS (+12dB)
        // Sweet spot for block fractures, concrete/glass impacts, and stone breaks
        const sfxCrunchBoost = audioCtx.createBiquadFilter();
        sfxCrunchBoost.type = 'peaking';
        sfxCrunchBoost.frequency.value = 3300;
        sfxCrunchBoost.Q.value = 1.2;
        sfxCrunchBoost.gain.value = 12.0; // +12dB boost for breaking block sound effects!

        // 5. High-Shelf Filter: CRISP DEBRIS SHATTER & AIR (+8.5dB)
        const sfxHighShelf = audioCtx.createBiquadFilter();
        sfxHighShelf.type = 'highshelf';
        sfxHighShelf.frequency.value = 6200;
        sfxHighShelf.gain.value = 8.5; // +8.5dB for sharp, sparkling debris & shatter

        // 6. Dynamics Compressor: Glues sound, allows sharp transients through, prevents clipping
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -18;
        compressor.knee.value = 10;
        compressor.ratio.value = 4.0;
        compressor.attack.value = 0.002; // Ultra-fast attack for snappy cracking block transients
        compressor.release.value = 0.15;

        // 7. Master Output Gain (Low volume level)
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.38; // Low output volume

        // Route audio graph: source -> musicBassCut -> musicMidCut1 -> musicMidCut2 -> sfxCrunchBoost -> sfxHighShelf -> compressor -> masterGain -> speakers
        audioSourceNode.connect(musicBassCut);
        musicBassCut.connect(musicMidCut1);
        musicMidCut1.connect(musicMidCut2);
        musicMidCut2.connect(sfxCrunchBoost);
        sfxCrunchBoost.connect(sfxHighShelf);
        sfxHighShelf.connect(compressor);
        compressor.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      } catch (err) {
        console.warn('[AudioDSP] Web Audio engine fallback:', err);
      }
    }

    // DO NOT MUTE INTRO VIDEO: Enable unmuted playback with low background music volume
    video.muted = false;
    video.defaultMuted = false;
    video.volume = 0.25; // Low background volume (25%)

    function playWithSound() {
      if (exited) return;
      video.muted = false;
      video.defaultMuted = false;
      video.volume = 0.25; // Keep background music volume low
      initAudioDSP();
      const p = video.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => {});
      }
    }

    // 1. Play unmuted immediately
    playWithSound();

    // 2. Play unmuted on load & buffer lifecycle
    ['canplay', 'canplaythrough', 'loadeddata', 'loadedmetadata'].forEach(evt => {
      video.addEventListener(evt, playWithSound);
    });
    ['load', 'DOMContentLoaded'].forEach(evt => {
      window.addEventListener(evt, playWithSound, { once: true });
    });

    // 3. Play unmuted automatically on any natural presence (moving mouse into window, window focus, scroll)
    //    WITHOUT needing to press any buttons!
    ['mousemove', 'pointermove', 'mouseenter', 'mouseover', 'focus', 'touchstart', 'scroll', 'wheel'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (!exited) {
          playWithSound();
        }
      }, { passive: true });
    });

    // Track Video Progress: play full video, and cut last 2.5 seconds
    video.addEventListener('timeupdate', () => {
      if (exited) return;

      const dur = (video.duration && !isNaN(video.duration) && video.duration > 0) ? video.duration : 27;
      const progress = Math.min(video.currentTime / dur, 1);
      if (progressBar) progressBar.style.width = `${progress * 100}%`;

      const curr = video.currentTime.toFixed(1);
      const total = dur.toFixed(1);

      if (statusText) {
        if (video.currentTime < 8) {
          statusText.innerText = `INITIALIZING NEURAL LINK • ${curr}s / ${total}s`;
        } else if (video.currentTime < 18) {
          statusText.innerText = `PROCESSING ARCHITECTURES • ${curr}s / ${total}s`;
        } else if (video.currentTime < 25) {
          statusText.innerText = `TRANSFERRING NEURAL DATA • ${curr}s / ${total}s`;
        } else {
          statusText.innerText = `ENTERING ML PORTAL • ${curr}s / ${total}s`;
        }
      }

      // Cut the last 2.5 seconds of the intro
      const fadeTrigger = (dur && dur > 3) ? Math.max(dur - 2.5, 1.0) : 24.5;
      if (video.currentTime >= fadeTrigger) {
        exit();
      }
    });

    // When video ends naturally
    video.addEventListener('ended', () => {
      if (!exited) exit();
    });

    // Primary Exit Function: smoothly fades out over 2s (from 25s to 27s), then redirects
    function exit(e) {
      if (exited) return;
      exited = true;

      try {
        sessionStorage.setItem('ml_intro_seen', 'true');
      } catch (err) { }

      // Apply fade-out transition class (2s duration)
      stage.classList.add('exit');
      if (statusText) statusText.innerText = 'LAUNCHING WEBSITE...';

      // After 2.0s fade-out completes (at ~27 sec), redirect to website
      setTimeout(() => {
        window.location.replace('../index.html');
      }, FADE_OUT_DURATION);
    }

    // Skip intro ONLY if Space bar is pressed
    window.addEventListener('keydown', (e) => {
      if (!exited && (e.code === 'Space' || e.key === ' ' || e.keyCode === 32)) {
        e.preventDefault();
        exit();
      }
    });

    // Fallback safety timer: if video hangs or takes > 35s, gracefully exit
    setTimeout(() => {
      if (!exited) exit();
    }, 35000);
  </script>
